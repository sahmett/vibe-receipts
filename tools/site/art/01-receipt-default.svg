<svg xmlns="http://www.w3.org/2000/svg" width="470" height="418" viewBox="0 0 470 418" fill="none" role="img" aria-labelledby="title desc"><title id="title">Fiş bildirimi — default</title><desc id="desc">Vektör yüzeyler, gradyanlar, yumuşak gölgeler ve ince doku ile yeniden çizim.</desc><defs>
 <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#19191f"/><stop offset=".52" stop-color="#111216"/><stop offset="1" stop-color="#131419"/></linearGradient>
 <radialGradient id="ambient"><stop stop-color="#747585" stop-opacity=".045"/><stop offset="1" stop-color="#111216" stop-opacity="0"/></radialGradient>
 <linearGradient id="edge" x2=".7" y2="1"><stop stop-color="#42424c" stop-opacity=".58"/><stop offset=".55" stop-color="#26262e" stop-opacity=".18"/><stop offset="1" stop-color="#303039" stop-opacity=".2"/></linearGradient>
 <linearGradient id="paper" x1=".15" y1="0" x2=".85" y2="1"><stop stop-color="#fff9ed"/><stop offset=".43" stop-color="#f6f1e8"/><stop offset="1" stop-color="#e5dfd5"/></linearGradient>
 <linearGradient id="fold" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#ddd7cd"/><stop offset=".5" stop-color="#f6f2e9"/><stop offset="1" stop-color="#fffdf7"/></linearGradient>
 <linearGradient id="dark" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#2c2d36"/><stop offset=".52" stop-color="#25262f"/><stop offset="1" stop-color="#1c1d25"/></linearGradient>
 <linearGradient id="rim" x1="0" y1="0" x2=".7" y2="1"><stop stop-color="#8a8a9c"/><stop offset=".15" stop-color="#51525f"/><stop offset=".65" stop-color="#2d2e39"/><stop offset="1" stop-color="#1c1d24"/></linearGradient>
 <linearGradient id="screen" x2=".8" y2="1"><stop stop-color="#202127"/><stop offset="1" stop-color="#090a0e"/></linearGradient>
 <linearGradient id="ink" x2="0" y2="1"><stop stop-color="#191a21"/><stop offset="1" stop-color="#090b0f"/></linearGradient>
 <linearGradient id="muted" x2="1" y2="1"><stop stop-color="#bbb7b4"/><stop offset="1" stop-color="#afacaa"/></linearGradient>
 <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6c53"/><stop offset=".5" stop-color="#ff4d3f"/><stop offset="1" stop-color="#ed372d"/></linearGradient>
 <linearGradient id="redEdge" x2=".7" y2="1"><stop stop-color="#ffaf8d"/><stop offset=".45" stop-color="#ff7560"/><stop offset="1" stop-color="#d63329"/></linearGradient>
 <filter id="shadow" x="-50%" y="-40%" width="200%" height="200%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
 <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="7" stdDeviation="6" flood-opacity=".32"/></filter>
 <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3" seed="14" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".045"/></feComponentTransfer><feComposite in2="SourceGraphic" operator="in"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
 <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
</defs><rect x="0.75" y="0.75" width="468.5" height="416.5" rx="36" fill="url(#tile)" stroke="url(#edge)" stroke-width="1.5"/><rect x="1" y="1" width="468" height="416" rx="36" fill="url(#ambient)" /><g transform="translate(0 0)"><g filter="url(#shadow)"><path d="M136 104 Q136 100 140 100 H318 Q322 100 322 104 V332 Q322 335 319 333 L307 323 292 334 277 323 262 334 247 323 232 334 217 323 202 334 187 323 172 334 155 323 139 334 Q136 335 136 332Z" fill="url(#paper)" stroke="#fffcf5" stroke-width="1" filter="url(#grain)"/><rect x="164" y="157" width="96" height="14" rx="7.0" fill="url(#muted)" /><rect x="164" y="191" width="77" height="14" rx="7.0" fill="url(#muted)" /><rect x="164" y="224" width="131" height="14" rx="7.0" fill="url(#muted)" /><rect x="164" y="263" width="131" height="24" rx="10" fill="url(#ink)" stroke="#fff" stroke-opacity=".65"/></g><g fill="none" stroke="url(#red)" stroke-width="9" stroke-linecap="round"><path d="M337 89l10-17 M350 106l18-7 M350 128l19 6"/></g></g></svg>