  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;

}

<script>

// a receipt in its own run's language and units, the layout receipts.py prints
function receipt(r){
  const L=r.L, f=m=>`${Math.floor(m/60)}${L.h} ${String(m%60).padStart(2,"0")}${L.m}`;
  const rows=r.items.map(([q,l,m])=>`<span>${Number(q).toLocaleString("en-US")}</span><span>${esc(l)}</span><span class="r">${f(m)}</span>`).join("");
  const stats=r.stats.map(s=>s?`<div class="row"><span>${esc(s[0])}</span><span>${esc(s[1])}</span></div>`:`<div class="sp"></div>`).join("");
  return `<div class="rc"><div class="tear t"></div><div class="paper">
    <div class="hd"><div class="t">VIBE RECEIPTS</div><div class="mu">github.com/sahmett/vibe-receipts</div><div class="mu ls">${esc(L.kind)}</div></div>
    <div class="hr"></div>
    <div class="row"><span>${esc(L.project)}</span><span class="nm">${esc(r.name)}</span></div>
    ${r.built?`<div class="row"><span>${esc(L.built)}</span><span class="nm">${esc(r.built.toUpperCase())}</span></div>`:""}
    <div class="row"><span>${esc(L.period)}</span><span>${esc(r.period)}</span></div>
    ${r.active?`<div class="row"><span>${esc(L.active)}</span><span>${r.active}</span></div>`:""}
    <div class="hr"></div>
    <div class="items"><span class="h">${esc(L.qty)}</span><span class="h">${esc(L.item)}</span><span class="h r">${esc(L.time)}</span>${rows}</div>

    ${r.value_text?`<div class="val"><span>${esc(L.value)}</span><span>${esc(r.value_text)}</span></div>`:""}
    <div class="tot"><span>${esc(L.total)}</span><span>${f(r.min)}</span></div>
    <div class="hr"></div>
    <div class="row thr"><span>${esc(r.thr[0])}</span><b>${esc(r.thr[1])}</b></div>${r.thr[2]?`<div class="mu">${esc(r.thr[2])}</div>`:""}
    <div class="ft"><div class="s">* SHOW THE RECEIPTS *</div><div class="bc"></div><div class="mu bn">${esc(r.name.toUpperCase())} · ${esc(r.end)}</div><div class="ty">THANK YOU FOR VIBING</div></div>
  </div><div class="tear b"></div></div>`;
}
const count=r=>r.estimate?`${r.commits} ${UI.commits}`:`${r.prompts.toLocaleString("en-US")} ${UI.prompts}`;

// ---- printer view: the printer, a floor of earlier receipts around it, and the receipt it prints. ----
// Every sheet is one receipt laid in the printer's 3D world, bent along its length: drawn as horizontal strips,
// each a flat piece of the bend. The printed receipt leaves the slot leaning back, curls over under its own
// weight, is torn off, tips back over the printer and drops onto the floor behind it, where it stays.
const G=PR.geo, VS=2.4, RW=34.67*15, WD=G.world;    // video px per viewBox unit; a receipt's own width in px; the printer's sizes
const q=G.paperW/RW;                                 // world units per receipt px (every receipt is 80 mm wide)
const LATEST=R[0];                                   // receipts.py sorts newest first
const fig=document.getElementById("fig"), readout=document.getElementById("readout"), rtext=readout.querySelector("span");
fig.setAttribute("aria-label",UI.figLabel(LATEST.name,fmt(LATEST.min))); fig.title=UI.reprint;
const cap=document.querySelector(".cap");
let VB, S=1, lamps=[], LY={}, built=false;

// world (x across, y toward the viewer, z up) to video px
const sp=p=>[G.zero[0]+p[0]*G.u[0]+p[1]*G.y[0]+p[2]*G.z[0],G.zero[1]+p[0]*G.u[1]+p[1]*G.y[1]+p[2]*G.z[1]];
const sv=d=>[d[0]*G.u[0]+d[1]*G.y[0]+d[2]*G.z[0],d[0]*G.u[1]+d[1]*G.y[1]+d[2]*G.z[1]];
const add=(a,b,k=1)=>[a[0]+b[0]*k,a[1]+b[1]*k,a[2]+b[2]*k];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const turn=(t,n,a)=>{const c=Math.cos(a),s=Math.sin(a); return [t[0]*c+n[0]*s,t[1]*c+n[1]*s,t[2]*c+n[2]*s];};
const rz=(d,a)=>{const c=Math.cos(a),s=Math.sin(a); return [d[0]*c-d[1]*s,d[0]*s+d[1]*c,d[2]];};
const lerp=(a,b,k)=>a+(b-a)*k, lerp3=(a,b,k)=>[lerp(a[0],b[0],k),lerp(a[1],b[1],k),lerp(a[2],b[2],k)];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), smooth=k=>k*k*(3-2*k), easeOut=k=>1-(1-k)*(1-k);
const RAD=Math.PI/180, LIGHT=(()=>{const l=[-.35,.55,.76], n=Math.hypot(...l); return l.map(x=>x/n);})();

// A sheet: a receipt, its strips, and a pose: base point B (the receipt's bottom-left corner), X across it,
// T0 up it at the base, N0 the way it bends, bend(s) the angle at s world units from the base, and off,
// how far up from the base the receipt's top is (less than its length while it is still in the printer).
function makeSheet(r,layer,band){
  const el=document.createElement("div"); el.className="sheet3"; layer.appendChild(el);
  el.innerHTML=`<div class="strip">${receipt(r)}<i></i></div>`;
  const H=el.querySelector(".rc").getBoundingClientRect().height||900, L=H*q, html=el.innerHTML;
  const bands=band(H,L); el.innerHTML=bands.map(()=>html).join("");
  const strips=[...el.children].map((s,i)=>({el:s,shade:s.querySelector("i"),j0:bands[i][0],j1:bands[i][1]}));
  return {r,el,H,L,strips,pose:null};
}
const uniform=h=>(H)=>Array.from({length:Math.ceil(H/h)},(_,i)=>[i*h,Math.min(H,(i+1)*h)]);
function endBands(lift){   // a flat sheet on the floor: one strip for the flat part, fine strips where its end lifts or rolls
  return (H,L)=>{const jl=Math.min(H,lift/q), out=[]; for(let j=0;j<jl;j+=22) out.push([j,Math.min(jl,j+22)]); if(jl<H) out.push([jl,H]); return out;};
}
function place(sh){
  const {B,X,T0,N0,bend,off,clip}=sh.pose, k=S/VS, ox=VB[0]*S, oy=VB[1]*S;
  const n=Math.max(1,Math.ceil(off)), P=[B];
  for(let i=0;i<n;i++) P.push(add(P[i],turn(T0,N0,bend(i+.5))));
  const at=s=>{if(s<=0) return add(B,T0,s); const i=Math.min(n-1,Math.floor(s)), f=s-i; return lerp3(P[i],P[i+1],f);};
  const dX=sv(X), out=off/q;
  for(const st of sh.strips){
    if(clip&&st.j0>=out){st.el.style.visibility="hidden"; continue;}
    st.el.style.visibility="";
    const jm=(st.j0+st.j1)/2, sm=off-jm*q, Tm=turn(T0,N0,bend(Math.max(0,sm))), Pm=at(sm), p=sp(Pm), dT=sv(Tm);
    const a=q*dX[0], b=q*dX[1], c=-q*dT[0], d=-q*dT[1];
    st.el.style.transform=`matrix(${a*k},${b*k},${c*k},${d*k},${(p[0]+jm*q*dT[0])*k-ox},${(p[1]+jm*q*dT[1])*k-oy})`;
    const lo=Math.max(0,st.j0-.8), hi=Math.min(H(sh),clip?Math.min(st.j1+.8,out):st.j1+.8);
    st.el.style.clipPath=`inset(${lo}px 0 ${Math.max(0,sh.H-hi)}px 0)`;
    const front=a*d-b*c>0, nrm=cross(Tm,X), lit=dot(front?nrm:nrm.map(v=>-v),LIGHT);   // the face we see, and how much light it gets
    st.el.classList.toggle("back",!front);
    const slot=sh.pose.slotShade?Math.max(0,1-Math.max(0,sm)/8)*.3:0;
    st.shade.style.opacity=(clamp((.86-lit)*.55,0,.3)+slot).toFixed(3);
    st.el.style.zIndex=Math.round(500+dot(add(Pm,X,G.paperW/2),G.view)*2);
  }
}
const H=sh=>sh.H;

// the floor around the printer: real receipts, near it and up to about a quarter of the window away
const FLOOR=[   // centre (world), heading in degrees (-90 = its top points away from you), how its end lifts
  {c:[-168,92],h:-118,end:"lift"}, {c:[186,78],h:-58,end:"roll"}, {c:[-226,-58],h:-102,end:"lift"},
  {c:[232,-88],h:-74,end:"roll"}, {c:[-318,36],h:-152,end:"lift"}, {c:[330,-14],h:-28,end:"lift"},
];
function floorPose(sh,cx,cy,headDeg,end){
  const h=headDeg*RAD, T0=[Math.cos(h),Math.sin(h),0], X=[-Math.sin(h),Math.cos(h),0], L=sh.L;
  const B=add(add([cx,cy,.6],T0,-L/2),X,-G.paperW/2);
  const R0=7, Lr=2*Math.PI*R0*1.25;   // a roll: about one and a quarter turns at the top end
  const bend=end==="roll"?(s=>s>L-Lr?(s-(L-Lr))/R0:0):(s=>.32*smooth(clamp((s-(L-26))/26)));
  return {B,X,T0,N0:[0,0,1],bend,off:L,clip:false};
}
const behind=sh=>dot(add(sh.pose.B,sh.pose.T0,sh.L/2),G.view)<dot([0,-10,0],G.view);   // drawn behind the printer or in front of it

// the printed receipt: on the slot, then torn off, tipped back, dropped behind the printer
const SLOT=[-G.paperW/2,WD.slotY,WD.top], LEAN=WD.lean*RAD, CURL=64*RAD, STIFF=34;
function printPose(sh,o,lift){
  const T0=[0,-Math.sin(LEAN),Math.cos(LEAN)], N0=[0,-Math.cos(LEAN),-Math.sin(LEAN)], L=sh.L;
  const f=s=>CURL*Math.pow(clamp((s-STIFF)/Math.max(60,L-STIFF)),1.6);
  return {B:add(SLOT,T0,lift),X:[1,0,0],T0,N0,bend:f,off:o,clip:lift===0,slotShade:lift===0};
}
function fallPose(sh,k,drift){   // k: 0..1 over the whole fall
  const L=sh.L, x0=SLOT[0]+drift.x, back=WD.shell[1]-4;
  const a=clamp(k/.45), b=clamp((k-.45)/.55);                  // tip back over the printer, then slide off and drop
  const lean=lerp(LEAN,90*RAD,easeOut(a));
  let T0=[0,-Math.sin(lean),Math.cos(lean)], N0=[0,-Math.cos(lean),-Math.sin(lean)], X=[1,0,0];
  const curl=1-easeOut(a), f=s=>curl*CURL*Math.pow(clamp((s-STIFF)/Math.max(60,L-STIFF)),1.6);
  const slide=smooth(clamp(b/.4)), drop=clamp((b-.3)/.7), start=add(SLOT,[0,-Math.sin(LEAN),Math.cos(LEAN)],3);
  let B=[lerp(start[0],x0,slide),lerp(start[1],back,slide),lerp(start[2],.6,drop*drop)];
  const turnZ=drift.a*easeOut(b); T0=rz(T0,turnZ); N0=rz(N0,turnZ); X=rz(X,turnZ);
  return {B,X,T0,N0,bend:f,off:L,clip:false};
}
function landedPose(sh,drift){
  const h=-90*RAD+drift.a, T0=[Math.cos(h),Math.sin(h),0], X=[-Math.sin(h),Math.cos(h),0];
  const B=[SLOT[0]+drift.x,WD.shell[1]-4,.6], L=sh.L;
  return {B,X,T0,N0:[0,0,1],bend:s=>.28*smooth(clamp((s-(L-24))/24)),off:L,clip:false};
}

let floor=[], current=null, queue=[], printed=0;
function buildFigure(){
  fig.innerHTML=`<div class="layer floorlayer" id="lyBack"></div>`+PR.back+`<div class="layer" id="lyMid"></div>`+PR.front+
    `<div class="layer floorlayer" id="lyFront"></div>`+G.leds.slice(0,2).map(()=>`<span class="lamp"></span>`).join("");
  LY={back:fig.querySelector("#lyBack"),mid:fig.querySelector("#lyMid"),front:fig.querySelector("#lyFront")};
  lamps=[...fig.querySelectorAll(".lamp")];
  // the floor: the receipts after the newest one, as many as there are spots (repeating if the archive is small)
  const others=R.length>1?R.slice(1):R;
  floor=FLOOR.map((spot,i)=>{const sh=makeSheet(others[i%others.length],LY.back,endBands(spot.end==="roll"?70:26)); sh.pose=floorPose(sh,spot.c[0],spot.c[1],spot.h,spot.end); sh.el.classList.add("floor"); return sh;});
  floor.forEach(sh=>{if(!behind(sh)) LY.front.appendChild(sh.el);});
  queue=[...R];
  // the box: printer, the printed sheet at its tallest, the floor in front and behind; the floor may run off the sides
  VB=null; current=makeSheet(queue[0],LY.mid,uniform(26));
  let top=Infinity, bottom=1868/VS;
  const probe=(pose,sh)=>{sh.pose=pose; const {B,T0,N0,bend,off}=pose; let p=B; for(let s=0;s<off;s+=6){p=add(p,turn(T0,N0,bend(s+3)),6); top=Math.min(top,sp(p)[1]/VS); top=Math.min(top,sp(add(p,pose.X,G.paperW))[1]/VS);}};
  probe(printPose(current,current.L,0),current);
  probe(landedPose(current,{x:0,a:0}),current);
  for(const sh of floor){const {B,X,T0,L}=sh.pose; for(const c of [B,add(B,X,G.paperW),add(B,T0,sh.L),add(add(B,T0,sh.L),X,G.paperW)]){const y=sp(c)[1]/VS; top=Math.min(top,y); bottom=Math.max(bottom,y+4);}}
  top-=10;
  VB=[26,top,1080/VS-52,bottom-top];
  fig.querySelectorAll("svg").forEach(s=>{s.setAttribute("viewBox",VB.join(" ")); s.removeAttribute("width"); s.removeAttribute("height"); s.setAttribute("preserveAspectRatio","xMidYMid meet");});
  current.pose=printPose(current,0,0);
  built=true; size();
  if(!buildFigure.wired){addEventListener("resize",size); buildFigure.wired=true;}
}
function size(){
  const room=innerHeight-96-cap.offsetHeight-28;   // nav and padding above, the caption below
  const w=Math.max(200,Math.min(innerWidth-32,600,room*VB[2]/VB[3]));
  S=w/VB[2]; fig.style.width=w+"px"; fig.style.height=(VB[3]*S)+"px"; paintAll();
}
let feed=0;
function paintAll(){
  if(!built) return;
  floor.forEach(place); if(current) place(current);
  lamps.forEach((el,i)=>{const [x,y]=G.leds[i]; el.style.left=((x/VS-VB[0])*S)+"px"; el.style.top=((y/VS-VB[1])*S)+"px"; el.style.setProperty("--on",i?feed:1);});
}

// one print: feed, hold, tear, fall, land; the next one starts after a pause, three on their own, then on a click
const ACC=.14, feedAt=x=>{const a=ACC, k=1/(1-a); return x<a?k*x*x/(2*a):x>1-a?1-k*(1-x)*(1-x)/(2*a):k*(x-a/2);};
let t0=0, raf=0, DP=4, drift={x:0,a:0}, auto=3;
function say(text,live){rtext.textContent=text; readout.classList.toggle("live",!!live);}
function begin(){
  if(!current||current.done){
    const r=queue[printed%queue.length]; current=makeSheet(r,LY.mid,uniform(26)); current.pose=printPose(current,0,0);
  }
  DP=Math.min(6,Math.max(3.4,2.2+current.r.items.length*.35));
  drift={x:(Math.random()-.5)*60,a:(Math.random()-.5)*34*RAD};
  t0=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(run);
}
function run(now){
  const t=(now-t0)/1000, idle=.5, end=idle+DP, hold=end+1.1, tear=hold+.16, fall=tear+1.15, sh=current, label=`${fmt(sh.r.min)} · ${count(sh.r)}`;
  feed=0;
  if(t<idle){sh.pose=printPose(sh,0,0); say(UI.ready);}
  else if(t<end){sh.pose=printPose(sh,sh.L*feedAt((t-idle)/DP),0); feed=.75+.25*Math.sin(t*44); say(`${UI.printing} · %${String(Math.round(feedAt((t-idle)/DP)*100)).padStart(3," ")}`,true);}
  else if(t<hold){sh.pose=printPose(sh,sh.L,0); say(label);}
  else if(t<tear){sh.pose=printPose(sh,sh.L,3*easeOut((t-hold)/.16));}                  // torn off: a short pull up
  else if(t<fall){const k=(t-tear)/1.15; sh.pose=fallPose(sh,k,drift); if(sh.pose.B[1]<WD.shell[1]&&sh.el.parentNode!==LY.back) LY.back.appendChild(sh.el);}   // behind the printer once past its back edge
  else {                                                                                  // on the floor, for good
    sh.pose=landedPose(sh,drift); sh.el.classList.add("floor"); sh.done=true; floor.push(sh); printed++;
    if(floor.length>FLOOR.length+8){const old=floor.splice(FLOOR.length,1)[0]; old.el.remove();}   // the oldest fallen sheet gives way after a dozen or so
    paintAll(); say(label);
    if(auto-->1) setTimeout(()=>{if(!document.getElementById("v-yazici").hidden) begin();},2600);
    return;
  }
  paintAll(); raf=requestAnimationFrame(run);
}
function startPrint(){
  cancelAnimationFrame(raf);
  if(still.matches){current.pose=printPose(current,current.L,0); paintAll(); say(`${fmt(current.r.min)} · ${count(current.r)}`); return;}
  if(current&&!current.done&&current.pose&&current.pose.off>0&&!current.pose.clip) return;   // mid-fall: let it land first
  begin();
}
fig.addEventListener("click",()=>{auto=0; startPrint();});

// ---- board view ----
const COLS=[{k:"due",dot:"half"},{k:"paid",dot:"full"},{k:"personal",dot:"dash"}];
// A status changed here is kept in this browser, until a run with --status sets a new one for that receipt.
const SAVE="vr-board-status";
let saved={}; try{saved=JSON.parse(localStorage.getItem(SAVE)||"{}")||{};}catch(e){saved={};}
R.forEach(r=>{const s=saved[r.key]; r.shown=s&&s.base===r.status?s.s:r.status;});
function setStatus(r,k){r.shown=k; saved[r.key]={s:k,base:r.status}; try{localStorage.setItem(SAVE,JSON.stringify(saved));}catch(e){}}
let period="q";
const daysAgo=n=>{const d=new Date(TODAY+"T12:00:00"); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10);};
const inPeriod=r=>period==="all"?true:period==="month"?r.end>=TODAY.slice(0,7)+"-01":r.end>=daysAgo(90);
const periodsEl=document.getElementById("periods");
periodsEl.setAttribute("aria-label",UI.period);
periodsEl.innerHTML=UI.periods.map(([k,l])=>`<button type="button" data-p="${k}" aria-pressed="${k===period}">${esc(l)}</button>`).join("");
periodsEl.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
  period=b.dataset.p; periodsEl.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); closeSheet(true); board(true);
}));

function card(r,i){
  const mx=Math.max(1,...r.items.map(x=>x[2]));
  const bars=r.items.slice(-12).map(x=>`<i style="height:${Math.max(12,x[2]/mx*100)}%"></i>`).join("");
  return `<button class="tk" type="button" draggable="true" data-key="${esc(r.key)}" style="--i:${i}" aria-label="${esc(r.name)}, ${fmt(r.min)}, ${UI.open}"><div class="face">
    <div class="top"><span class="nm">${esc(r.name)}</span>${r.client?`<span class="cl">${esc(r.client)}</span>`:""}</div>
    <div class="pd">${esc(r.period)}</div>
    <div class="mid"><span class="hrs">${fmt(r.min)}</span><span class="bars" aria-hidden="true">${bars}</span></div>
    <div class="meta"><span>${r.estimate?UI.est:count(r)}</span><span>${r.value_text?esc(r.value_text):"—"}</span></div>
  </div></button>`;
}
const colsEl=document.getElementById("cols");
function board(enter){
  const list=R.filter(inPeriod), sum=k=>list.filter(r=>r.shown===k).reduce((s,r)=>s+r.min,0);
  const vals=[fmt(list.reduce((s,r)=>s+r.min,0)),fmt(sum("due")),usd(list.reduce((s,r)=>s+(r.value||0),0)),String(list.length)];
  document.getElementById("metrics").innerHTML=UI.metrics.map((l,i)=>`<div><span>${esc(l)}</span><b>${vals[i]}</b></div>`).join("");
  let i=0;
  colsEl.innerHTML=COLS.map(c=>{
    const items=list.filter(r=>r.shown===c.k);
    return `<section class="col" data-k="${c.k}" aria-label="${esc(UI.cols[c.k])}"><div class="colh"><span class="dot ${c.dot}"></span>${esc(UI.cols[c.k])}<span class="n">${items.length}</span><span class="h">${fmt(items.reduce((s,r)=>s+r.min,0))}</span></div>
      <div class="stack">${items.length?items.map(r=>card(r,i++)).join(""):`<div class="empty">${esc(UI.empty)}</div>`}</div></section>`;
  }).join("");
  colsEl.classList.toggle("enter",!!enter&&!still.matches);
  if(sheet) document.querySelector(`.tk[data-key="${CSS.escape(sheet.key)}"]`)?.classList.add("away");
  wire();
}
let dragKey=null;
const fine=matchMedia("(hover:hover) and (pointer:fine)");
function wire(){
  colsEl.querySelectorAll(".tk").forEach(el=>{
    el.addEventListener("click",()=>openSheet(el));
    el.addEventListener("dragstart",e=>{closeSheet(true); el.style.transform=""; dragKey=el.dataset.key; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; e.dataTransfer.setData("text/plain",dragKey);});
    el.addEventListener("dragend",()=>{el.classList.remove("dragging"); dragKey=null;});
    // a slight tilt toward the pointer, like picking up a slip of paper
    el.addEventListener("pointermove",e=>{
      if(!fine.matches||still.matches||dragKey) return;
      const b=el.getBoundingClientRect(), x=(e.clientX-b.left)/b.width-.5, y=(e.clientY-b.top)/b.height-.5;
      el.style.transform=`rotateX(${(-y*6).toFixed(2)}deg) rotateY(${(x*8).toFixed(2)}deg) translateZ(6px)`;
    });
    el.addEventListener("pointerleave",()=>{el.style.transform="";});
  });
  colsEl.querySelectorAll(".col").forEach(col=>{
    col.addEventListener("dragover",e=>{if(dragKey){e.preventDefault(); col.classList.add("over");}});
    col.addEventListener("dragleave",e=>{if(!col.contains(e.relatedTarget)) col.classList.remove("over");});
    col.addEventListener("drop",e=>{e.preventDefault(); col.classList.remove("over"); const r=R.find(x=>x.key===(dragKey||e.dataTransfer.getData("text/plain"))); if(r){setStatus(r,col.dataset.k); board(false);}});
  });
}

// ---- the receipt flips out of its card and floats beside it; it flips back in on close ----
let sheet=null;   // {key, el, cardEl}
const P="perspective(1400px)";
function fitSheet(el){
  let fs=11.4; el.querySelector(".rc").style.setProperty("--fs",fs+"px");
  const h=el.getBoundingClientRect().height, w=34.67*fs, room=innerHeight-56;
  const k=Math.min(1,room/h,(innerWidth-32)/w); fs*=k; el.querySelector(".rc").style.setProperty("--fs",fs+"px");
  el.style.width=(34.67*fs)+"px";
  return el.getBoundingClientRect();
}
function placeFor(card,b){   // the middle of the window
  const c=card.getBoundingClientRect();
  return {left:Math.max(16,(innerWidth-b.width)/2),top:Math.max(16,(innerHeight-b.height)/2),c};
}
const veil=document.createElement("div"); veil.className="veil"; veil.setAttribute("aria-hidden","true"); document.body.appendChild(veil);
["wheel","touchmove"].forEach(n=>veil.addEventListener(n,e=>e.preventDefault(),{passive:false}));   // the page stays put behind it, with no scrollbar change
// A spring follows the pointer: up to 9° left and right, 6° up and down; the shadow moves the other way.
function tiltable(el){
  if(!fine.matches||still.matches) return null;
  const tw=el.querySelector(".tilt"), sh=el.querySelector(".sheet"), paper=el.querySelector(".paper");
  paper.insertAdjacentHTML("beforeend",`<div class="shade"></div><div class="gloss"></div>`);
  const shade=paper.querySelector(".shade"), gloss=paper.querySelector(".gloss");
  let tx=0,ty=0,x=0,y=0,vx=0,vy=0,gx=.5,gy=.3,raf=0,on=false;
  const step=()=>{
    vx=(vx+(tx-x)*.12)*.74; vy=(vy+(ty-y)*.12)*.74; x+=vx; y+=vy;
    tw.style.transform=`perspective(1000px) rotateX(${y.toFixed(2)}deg) rotateY(${x.toFixed(2)}deg)`;
    sh.style.setProperty("--sx",(-x*1.6).toFixed(1)+"px"); sh.style.setProperty("--sy",(28+y*1.4).toFixed(1)+"px");
    const a=Math.min(.16,Math.abs(x)*.016);
    shade.style.background=`linear-gradient(90deg,rgba(0,0,0,${x>0?a:0}),transparent 45%,transparent 55%,rgba(0,0,0,${x<0?a:0}))`;
    gloss.style.background=`radial-gradient(70% 55% at ${(gx*100).toFixed(1)}% ${(gy*100).toFixed(1)}%,rgba(255,255,255,.9),rgba(255,255,255,0) 70%)`;
    if(on||Math.abs(tx-x)+Math.abs(ty-y)+Math.abs(vx)+Math.abs(vy)>.02) raf=requestAnimationFrame(step); else {raf=0; tw.style.transform="";}
  };
  const kick=()=>{if(!raf) raf=requestAnimationFrame(step);};
  el.addEventListener("pointermove",e=>{
    const b=el.getBoundingClientRect(), px=(e.clientX-b.left)/b.width, py=(e.clientY-b.top)/b.height;
    if(px<0||px>1||py<0||py>1) return;
    on=true; el.classList.add("tilting"); tx=(px-.5)*18; ty=-(py-.5)*12; gx=px; gy=py; kick();
  });
  el.addEventListener("pointerleave",()=>{on=false; el.classList.remove("tilting"); tx=0; ty=0; kick();});
  return {stop(){on=false; cancelAnimationFrame(raf); raf=0; tw.style.transform=""; el.classList.remove("tilting");}};
}
function openSheet(cardEl){
  const key=cardEl.dataset.key, r=R.find(x=>x.key===key);
  if(sheet&&sheet.key===key){closeSheet(); return;}
  closeSheet(true);
  cardEl.style.transition="none"; cardEl.style.transform="";
  const el=document.createElement("div"); el.className="float"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label",r.name); el.tabIndex=-1;
  el.innerHTML=`<div class="sheet"><div class="tilt">${receipt(r)}</div></div>`;
  el.style.visibility="hidden"; document.body.appendChild(el);
  const b=fitSheet(el), {left,top,c}=placeFor(cardEl,b);
  el.style.left=left+"px"; el.style.top=top+"px"; el.style.visibility="";
  sheet={key,el,cardEl,left,top,tilt:tiltable(el)};
  veil.classList.add("on");
  if(still.matches){cardEl.classList.add("away"); el.animate([{opacity:0},{opacity:1}],{duration:160}); el.focus({preventScroll:true}); return;}
  // 1) the card turns away on its own axis; 2) the receipt turns in from the card's spot, growing to full size
  const from=`translate(${c.left-left}px,${c.top-top}px) scale(${c.width/b.width},${c.height/b.height})`;
  cardEl.animate([{transform:`${P} rotateY(0deg)`},{transform:`${P} rotateY(90deg)`}],{duration:200,easing:"cubic-bezier(.5,0,.9,.5)",fill:"forwards"})
    .finished.then(()=>{cardEl.classList.add("away"); cardEl.getAnimations().forEach(a=>a.cancel());});
  el.animate([   // per-step easing, so the sheet waits edge-on until the card has turned away (200 ms)
    {transform:`${from} ${P} rotateY(-90deg)`,offset:0},
    {transform:`${from} ${P} rotateY(-90deg)`,offset:.26,easing:"cubic-bezier(.2,.8,.25,1)"},
    {transform:`translate(0,0) scale(1) ${P} rotateY(10deg) rotateZ(-1.2deg)`,offset:.8,easing:"ease-in-out"},
    {transform:`translate(0,0) scale(1) ${P} rotateY(0deg) rotateZ(0deg)`,offset:1}],
    {duration:760});
  setTimeout(()=>el.focus({preventScroll:true}),400);
}
function closeSheet(instant,byKey){
  if(!sheet) return;
  const {el,key,tilt}=sheet; sheet=null; if(tilt) tilt.stop();
  veil.classList.remove("on");
  const cardEl=document.querySelector(`.tk[data-key="${CSS.escape(key)}"]`);
  const done=()=>{el.remove(); if(cardEl){cardEl.classList.remove("away"); cardEl.style.transition="";}};
  if(instant||still.matches||!cardEl){done(); return;}
  const b=el.getBoundingClientRect(), c=cardEl.getBoundingClientRect();
  const to=`translate(${c.left-b.left}px,${c.top-b.top}px) scale(${c.width/b.width},${c.height/b.height})`;
  el.animate([{transform:`translate(0,0) scale(1) ${P} rotateY(0deg)`},{transform:`${to} ${P} rotateY(90deg)`}],{duration:380,easing:"cubic-bezier(.6,0,.7,.4)",fill:"forwards"})
    .finished.then(()=>{
      el.remove(); cardEl.classList.remove("away");
      cardEl.animate([{transform:`${P} rotateY(-90deg)`},{transform:`${P} rotateY(6deg)`,offset:.7},{transform:`${P} rotateY(0deg)`}],{duration:320,easing:"cubic-bezier(.2,.8,.3,1)"})
        .finished.then(()=>{cardEl.style.transition="";});
      if(byKey) cardEl.focus({preventScroll:true});   // back to the card for keyboard users; a click leaves no focus ring
    });
}
addEventListener("pointerdown",e=>{if(sheet&&!sheet.el.contains(e.target)) closeSheet();});   // a click anywhere off the receipt closes it
addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet) closeSheet(false,true);});
addEventListener("resize",()=>{   // keep the open receipt in the middle, sized to the new window
  if(!sheet) return; const b=fitSheet(sheet.el), {left,top}=placeFor(sheet.cardEl,b);
  sheet.el.style.left=left+"px"; sheet.el.style.top=top+"px";
});

// ---- the two views; the pill slides to the current one ----
const pill=document.querySelector("nav .pill");
function movePill(a){pill.style.left=a.offsetLeft+"px"; pill.style.width=a.offsetWidth+"px";}
let boardShown=false;
function route(){
  const v=location.hash==="#pano"?"pano":"yazici";
  closeSheet(true);
  document.getElementById("v-yazici").hidden=v!=="yazici"; document.getElementById("v-pano").hidden=v!=="pano";
  document.querySelectorAll("nav a").forEach(a=>{if(a.dataset.view===v){a.setAttribute("aria-current","page"); movePill(a);} else a.removeAttribute("aria-current");});
  if(v==="yazici"){if(!built){buildFigure(); startPrint();} else size();}
  else {cancelAnimationFrame(raf); board(!boardShown); boardShown=true;}
  scrollTo(0,0);
}
addEventListener("hashchange",route);
function fontsReady(){   // system faces are there at once; this only waits for the document to settle
  return document.fonts?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,300))]):Promise.resolve();
}
fontsReady().then(()=>{
  route();                                              // builds and measures the visible view, still hidden
  requestAnimationFrame(()=>{
    root.classList.remove("boot");
    requestAnimationFrame(()=>document.querySelector("nav").classList.add("ready"));   // the pill only slides from now on
  });
  // a face that arrives after the reveal: measure again, so the receipt's strips and the pill match the text
  if(document.fonts) document.fonts.addEventListener("loadingdone",()=>{
    const a=document.querySelector('nav a[aria-current="page"]'); if(a) movePill(a);
  });
  new ResizeObserver(()=>{if(built) size();}).observe(cap);
});
</script>
