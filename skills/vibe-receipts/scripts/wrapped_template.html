<!doctype html>
<html lang="__LANG__"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vibe Wrapped</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>
/* Filled in by receipts.py --wrapped (wrapped.py): one 9:16 story card at a time on a dark stage, each a full-bleed
   colour field with the thermal-receipt motif. Cards without data for this year are left out. POSTER: the last
   card alone, full bleed, for the PNG. */
:root{
  --stage:#0c0a10; --night:#17131f; --ink:#121016; --paper:#f2eee3; --paper-ink:#1d1c1a; --muted-paper:#6b665d;
  --lav:#c4b5fd; --coral:#ff5b47; --butter:#f7e36b; --pine:#0e5e52; --mist:#a59fb4;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
.stage{height:100%;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:10px;padding:14px 16px}
.phone{position:relative;width:min(100%,460px,calc((100svh - 74px)*.5625));aspect-ratio:9/16;border-radius:22px;overflow:hidden;
  container-type:size;background:var(--night);box-shadow:0 30px 80px -20px #000,0 0 0 1px #ffffff14;user-select:none;-webkit-user-select:none;touch-action:manipulation;outline:none}
.phone:focus-visible{box-shadow:0 30px 80px -20px #000,0 0 0 2px var(--lav)}
.poster .stage{padding:0}.poster .phone{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none}
.poster .bars,.poster .tap,.poster .under,.poster .actions,.poster .toast,.poster .caption{display:none}
.poster .final{justify-content:center;gap:3.4cqh}
.sig{display:none;font:700 3cqw/1.4 var(--mono);letter-spacing:.08em;color:var(--mist);text-align:center}
.sig b{color:var(--paper);font-weight:700}.sig i{display:inline-block;width:1.6cqw;height:1.6cqw;border-radius:50%;background:var(--coral);margin-right:2cqw;vertical-align:.2cqw}
.poster .sig{display:block}
.under{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;font:500 12px/1.4 var(--mono);color:var(--mist);letter-spacing:.04em}
.under button{font:inherit;color:var(--paper);background:#ffffff12;border:1px solid #ffffff22;border-radius:999px;padding:5px 11px;cursor:pointer}
.under button:hover{background:#ffffff22}
.bars{position:absolute;inset:2.2cqh 3.4cqw auto;display:flex;gap:1cqw;z-index:5}
.bar{flex:1;height:.42cqh;min-height:3px;border-radius:2px;background:#ffffff40;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff}
.top{position:absolute;top:4cqh;left:4.2cqw;right:4.2cqw;display:flex;justify-content:space-between;align-items:center;z-index:5;
  font:700 2.9cqw/1 var(--mono);letter-spacing:.14em;color:var(--paper);transition:color .3s}
.phone[data-ink="dark"] .top{color:var(--ink)}
.phone[data-ink="dark"] .bar{background:#12101633}.phone[data-ink="dark"] .bar i{background:var(--ink)}
.tap{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:30% 70%}
.tap button{all:unset;cursor:pointer}

.card{position:absolute;inset:0;padding:13cqh 7cqw 8cqh;display:flex;flex-direction:column;gap:2.2cqh;opacity:0;visibility:hidden;transition:opacity .35s ease,visibility 0s .35s}
.card.on{opacity:1;visibility:visible;transition:opacity .35s ease}
.kicker{font:700 3.1cqw/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.huge{font:900 21cqw/.86 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.big{font:900 13cqw/.9 var(--display);letter-spacing:-.005em;text-wrap:balance}
.mid{font:800 8.6cqw/.98 var(--display);text-wrap:balance}
.lede{font:500 4.4cqw/1.35 var(--body);max-width:34ch;text-wrap:pretty;margin:0}
.small{font:500 3.4cqw/1.4 var(--body);opacity:.85;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.grow{flex:1}
p{margin:0}
.c-night{background:var(--night);color:var(--paper)}.c-coral{background:var(--coral);color:var(--ink)}.c-butter{background:var(--butter);color:var(--ink)}
.c-paper{background:var(--paper);color:var(--paper-ink)}.c-pine{background:var(--pine);color:var(--paper)}.c-lav{background:var(--lav);color:var(--ink)}
.card.in .rise{animation:rise .7s cubic-bezier(.2,.7,.1,1) both}
.card.in .rise:nth-child(2){animation-delay:.08s}.card.in .rise:nth-child(3){animation-delay:.16s}
.card.in .rise:nth-child(4){animation-delay:.24s}.card.in .rise:nth-child(5){animation-delay:.32s}.card.in .rise:nth-child(6){animation-delay:.4s}
@keyframes rise{from{transform:translateY(3.5cqh);opacity:0}to{transform:none;opacity:1}}

.intro .year{font:900 36cqw/.8 var(--display);color:transparent;-webkit-text-stroke:.5cqw var(--lav);letter-spacing:-.02em}
.slip{position:absolute;right:6cqw;bottom:7cqh;width:34cqw;background:var(--paper);color:var(--paper-ink);font:500 2.3cqw/1.55 var(--mono);padding:3cqh 3cqw 2cqh;transform-origin:top;box-shadow:0 2cqh 4cqh #0006}
.slip::after{content:"";position:absolute;left:0;right:0;bottom:-1.2cqh;height:1.2cqh;
  background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/2.4cqw 100%,linear-gradient(-135deg,var(--paper) 50%,transparent 50%) 0 0/2.4cqw 100%}
.card.in .slip{animation:print 2.4s steps(14,end) both}
@keyframes print{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 -10% 0)}}
.slip b{font-weight:800;letter-spacing:.12em}.slip .row{display:flex;justify-content:space-between}
.rule{border-top:1.5px dashed currentColor;opacity:.45;margin:1cqh 0}

.months{display:grid;grid-template-columns:repeat(12,1fr);align-items:end;gap:1.3cqw;height:34cqh;border-bottom:.5cqw solid currentColor;padding-bottom:.6cqh}
.months div{position:relative;background:var(--ink);border-radius:.6cqw .6cqw 0 0;height:calc(var(--h)*1%);min-height:1px;transform-origin:bottom}
.months div.peak{background:var(--coral)}
.months div.peak::before{content:attr(data-v);position:absolute;bottom:calc(100% + .8cqh);left:50%;transform:translateX(-50%);font:800 3cqw/1 var(--mono);white-space:nowrap}
.card.in .months div{animation:bar .9s cubic-bezier(.2,.7,.1,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes bar{from{transform:scaleY(0)}to{transform:none}}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:1.3cqw;font:700 2.4cqw/1 var(--mono);text-align:center;opacity:.75}

.receipt{background:#fffdf7;color:var(--paper-ink);font:500 3.15cqw/1.62 var(--mono);padding:3cqh 5cqw;box-shadow:0 1.6cqh 3cqh #0002;position:relative}
.receipt .li{display:grid;grid-template-columns:auto 1fr auto;gap:2cqw;align-items:baseline}
.receipt .li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:44cqw}
.receipt .li .dots{border-bottom:.35cqw dotted #0005;transform:translateY(-.6cqh)}
.receipt .hd{display:flex;justify-content:space-between;font-size:2.4cqw;letter-spacing:.14em;color:var(--muted-paper)}
.receipt .tot{display:flex;justify-content:space-between;font:800 5.6cqw/1.2 var(--mono);border-top:.8cqw double var(--paper-ink);padding-top:1.2cqh;margin-top:1cqh}
.receipt .li.top1{font-weight:800}
.receipt .more{color:var(--muted-paper)}

.heat{display:grid;grid-template-columns:5cqw repeat(24,1fr);gap:.55cqw;align-items:center}
.heat span{aspect-ratio:1;border-radius:.5cqw;background:var(--paper);opacity:calc(.06 + var(--v)*.94)}
.heat span.hot{background:var(--butter);opacity:1;box-shadow:0 0 2cqw var(--butter)}
.heat em{font:700 2.3cqw/1 var(--mono);font-style:normal;opacity:.7}
.hours{display:grid;grid-template-columns:5cqw repeat(4,1fr);font:700 2.3cqw/1 var(--mono);opacity:.7;margin-top:.6cqh}
.card.in .heat span{animation:fade .5s ease both;animation-delay:calc(var(--c)*14ms)}
@keyframes fade{from{opacity:0}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1.6cqh 5cqw}
.stats div{display:flex;flex-direction:column;gap:.5cqh}
.stats b{font:900 10cqw/.9 var(--display)}
.stats span{font:500 3.1cqw/1.3 var(--body);opacity:.85}

.leaf{align-self:flex-start;background:var(--paper);color:var(--paper-ink);border-radius:2cqw;overflow:hidden;width:52cqw;box-shadow:0 2cqh 4cqh #0003;transform:rotate(-3deg)}
.leaf .m{background:var(--coral);color:var(--ink);font:800 4.4cqw/1 var(--mono);letter-spacing:.2em;text-align:center;padding:1.6cqh 0}
.leaf .d{font:900 30cqw/1 var(--display);text-align:center;padding-top:1cqh}
.leaf .w{font:700 3.4cqw/1 var(--mono);letter-spacing:.2em;text-align:center;padding:0 0 2.4cqh;color:var(--muted-paper)}
.streak{display:flex;gap:.9cqw;flex-wrap:wrap}
.streak i{width:4.6cqw;height:4.6cqw;border-radius:50%;background:var(--ink)}
.card.in .streak i{animation:pop .4s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i)*40ms + .3s)}
@keyframes pop{from{transform:scale(0)}}

.quote{font:900 12cqw/.9 var(--display)}
.strike{background:linear-gradient(var(--ink),var(--ink)) no-repeat 0 58%/100% 1.4cqw;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.card.in .strike{animation:strike .6s .9s cubic-bezier(.6,0,.2,1) both}
@keyframes strike{from{background-size:0% 1.4cqw}}
.later{font:900 22cqw/.85 var(--display);color:var(--paper);-webkit-text-stroke:.4cqw var(--ink);paint-order:stroke fill}
.tag{display:inline-flex;align-self:flex-start;background:var(--ink);color:var(--coral);font:800 3.4cqw/1 var(--mono);padding:1.4cqh 3cqw;letter-spacing:.06em;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.mix{display:flex;height:6cqh;border-radius:1.4cqw;overflow:hidden}
.mix div{display:flex;align-items:center;padding-left:2cqw;font:800 3cqw/1 var(--mono);color:var(--ink);width:calc(var(--w)*1%);background:var(--c)}
.legend{display:flex;gap:4cqw;font:600 3cqw/1 var(--mono);opacity:.85;flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:2.4cqw;height:2.4cqw;border-radius:50%;margin-right:1.4cqw;vertical-align:-.2cqw;background:var(--c)}
.dollar{font:900 27cqw/.85 var(--display);color:var(--lav)}

.badge{align-self:center;width:62cqw;aspect-ratio:1;border-radius:50%;background:var(--ink);color:var(--butter);display:grid;place-items:center;text-align:center;position:relative;margin-block:1cqh;padding:6cqw}
.badge::before{content:"";position:absolute;inset:2.2cqw;border-radius:50%;border:.5cqw dashed var(--butter);opacity:.6}
.card.in .badge::before{animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.badge b{font:900 10cqw/.88 var(--display);text-transform:uppercase}
.badge small{display:block;font:700 2.6cqw/1.2 var(--mono);letter-spacing:.2em;margin-bottom:1.4cqh;color:var(--paper)}
.traits{display:flex;flex-direction:column;gap:1cqh;font:600 3.5cqw/1.3 var(--mono)}
.traits div{display:flex;justify-content:space-between;border-bottom:.35cqw solid #0003;padding-bottom:.9cqh}

.final{align-items:center}
.final .receipt{width:76cqw;font-size:2.95cqw;padding:3cqh 5.5cqw 2.6cqh}
.final .receipt .t{text-align:center;font:800 5.4cqw/1.1 var(--mono);letter-spacing:.16em}
.final .receipt .c{text-align:center;font-size:2.3cqw;color:var(--muted-paper);letter-spacing:.12em}
.final .receipt .row{display:flex;justify-content:space-between;gap:2cqw}
.final .receipt .row span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.final .receipt .grand{display:flex;justify-content:space-between;align-items:baseline;font:800 4cqw/1 var(--mono);margin-top:1cqh}
.final .receipt .grand span:last-child{font:900 11cqw/1 var(--display)}
.bc{height:5cqh;margin:1.6cqh auto 0;width:70%;background:repeating-linear-gradient(90deg,var(--paper-ink) 0 .5cqw,transparent .5cqw .9cqw,var(--paper-ink) .9cqw 1.1cqw,transparent 1.1cqw 1.7cqw,var(--paper-ink) 1.7cqw 2.4cqw,transparent 2.4cqw 2.8cqw)}
.actions{position:relative;z-index:6;display:flex;gap:2.4cqw;flex-wrap:wrap;justify-content:center}
.actions button{font:700 3.3cqw/1 var(--mono);letter-spacing:.06em;border-radius:999px;padding:2cqh 4.6cqw;cursor:pointer;border:.35cqw solid var(--paper)}
.actions .primary{background:var(--paper);color:var(--ink)}.actions .ghost{background:transparent;color:var(--paper)}
.toast{font:600 3cqw/1.3 var(--mono);color:var(--lav);min-height:1.3em;text-align:center}
.caption{font:500 2.8cqw/1.45 var(--mono);color:var(--mist);text-align:center;max-width:70cqw;user-select:all;-webkit-user-select:all}
@media (prefers-reduced-motion:reduce){.card,.card.on{transition:none}.card.in *,.card.in *::before,.card.in *::after{animation:none!important}}
</style></head>

  const list=[];
  list.push({c:"c-night intro",dur:5200,h:`
    <div class="kicker rise">${t.introK}</div><div class="year rise">${Y.year}</div>
    <div class="huge rise" lang="en" style="color:var(--paper)">VIBE<br>WRAPPED</div><div class="grow"></div>
    <p class="lede rise" style="max-width:52cqw">${t.introL}</p>
    <div class="slip" aria-hidden="true" lang="en"><b>VIBE RECEIPTS</b><div class="rule"></div>
      <div class="row"><span>${t.fH}</span><span>${Math.floor(Y.total/60)}</span></div>
      ${Y.prompts?`<div class="row"><span>${t.fP}</span><span>${fmt(Y.prompts)}</span></div>`:""}
      <div class="row"><span>${t.fPr}</span><span>${P.length}</span></div><div class="rule"></div>
      <div class="row"><b>${Y.year}</b><span>✳︎</span></div></div>`});
  list.push({c:"c-coral",dur:5600,h:`
    <div class="kicker rise">${t.hoursK}</div><div class="huge rise" data-min="${Y.total}">${hm(Y.total)}</div>
    <p class="mid rise">${t.hoursL}</p><div class="grow"></div>
    ${Y.prompts?`<p class="lede rise">${t.hoursS(fmt(Y.prompts),Y.activeDays)}</p>`:`<p class="lede rise">${fmt(Y.commits)} commit</p>`}
    <p class="small rise">${t.hoursF(Math.floor(Y.total/120))}</p>`});
  if(maxM>0&&Y.months.filter(Boolean).length>1) list.push({c:"c-butter",dur:5600,h:`
    <div class="kicker rise">${t.monthsK}</div><div class="big rise">${t.monthsT(t.monthNames[peakI])}</div>
    <p class="lede rise">${t.monthsL(hm(maxM))}</p><div class="grow"></div>
    <div class="months rise" role="img">${Y.months.map((v,i)=>`<div style="--h:${v/maxM*100};--i:${i}" class="${i===peakI?"peak":""}" data-v="${Math.round(v/60)}${t.h}"></div>`).join("")}</div>
    <div class="mlabels">${t.months.map(m=>`<span>${m}</span>`).join("")}</div>
    ${Y.approx?`<p class="small rise">${t.approx}</p>`:""}`});
  list.push({c:"c-paper",dur:6400,h:`
    <div class="kicker rise">${t.projK}</div><div class="big rise">${t.projT(P.length)}</div><div class="grow"></div>
    <div class="receipt rise"><div class="hd"><span>${t.qty}</span><span>${t.time}</span></div><div class="rule"></div>
      ${shown.map(([n,m],i)=>`<div class="li ${i===0?"top1":""}"><span>${esc(n)}</span><span class="dots"></span><span class="num">${hm(m)}</span></div>`).join("")}
      ${rest>0?`<div class="li more"><span>${t.more(rest)}</span><span></span><span class="num">${hm(P.slice(9).reduce((s,p)=>s+p[1],0))}</span></div>`:""}
      <div class="tot"><span>${t.totalL}</span><span class="num">${hm(Y.total)}</span></div></div>`});
  if(Y.clock){
    const mx=Math.max(1,...Y.clock.flat());
    list.push({c:"c-pine",dur:6000,h:`
      <div class="kicker rise">${t.clockK}</div><div class="big rise">${t.clockT(String(Y.peakHour).padStart(2,"0")+":00")}</div><div class="grow"></div>
      <div class="rise" role="img"><div class="heat">${t.days.map((dn,di)=>`<em>${dn}</em>`+Y.clock[di].map((v,h)=>`<span class="${di===Y.peakDay&&h===Y.peakHour?"hot":""}" style="--v:${(v/mx).toFixed(2)};--c:${di*24+h}"></span>`).join("")).join("")}</div>
        <div class="hours"><span></span><span>00</span><span>06</span><span>12</span><span>18</span></div></div>
      <div class="stats rise">
        <div><b>${String(Y.peakHour).padStart(2,"0")}:00</b><span>${t.peak}</span></div>
        <div><b>%${Y.night}</b><span>${t.late}</span></div>
        <div><b>%${Y.weekend}</b><span>${t.wkend}</span></div>
        ${Y.breakAt?`<div><b>${dec(Y.breakAt)} ${t.min}</b><span>${t.brk}</span></div>`:""}
      </div>`});
  }
  if(Y.busiest){
    const d=new Date(Y.busiest.date+"T12:00:00"), wd=(d.getDay()+6)%7;
    list.push({c:"c-lav",dur:5600,h:`
      <div class="kicker rise">${t.dayK}</div>
      <div class="leaf rise"><div class="m">${t.monthNames[d.getMonth()].toLocaleUpperCase(lang)}</div><div class="d">${d.getDate()}</div><div class="w">${t.weekdays[wd]} · ${Y.year}</div></div>
      <div class="grow"></div><p class="mid rise">${t.dayL(hm(Y.busiest.min),Y.busiest.prompts)}</p>
      ${Y.streak>1?`<div class="streak rise" aria-hidden="true">${Array.from({length:Math.min(Y.streak,60)},(_,i)=>`<i style="--i:${i}"></i>`).join("")}</div><p class="small rise">${t.streakL(Y.streak)}</p>`:""}`});
  }
  if(Y.longest&&Y.longest[1]>=240) list.push({c:"c-coral",dur:6000,h:`
    <div class="kicker rise">${t.twoK}</div><div class="quote rise"><span class="strike">${t.twoQ}</span></div><div class="grow"></div>
    <div class="tag rise">${esc(Y.longest[0])}</div><div class="later rise">${hm(Y.longest[1])}</div><p class="big rise">${t.twoL}</p>`});
  if(Y.value||Y.read) list.push({c:"c-night",dur:6000,h:`
    <div class="kicker rise">${t.tokK}</div>
    ${Y.read?`<p class="lede rise">${t.tokL(short(Y.read),short(Y.written))}</p>`:""}
    ${Y.value?`<div class="dollar rise" style="font-size:${Math.min(27,128/value.length).toFixed(1)}cqw">${value}</div><p class="small rise">${t.tokV}</p>`:""}
    <div class="grow"></div>
    ${Y.mix.length?`<div class="kicker rise">${t.tokM}</div>
      <div class="mix rise">${Y.mix.map(([n,p],i)=>`<div style="--w:${p};--c:var(${MIXC[i]})">${p>=10?p+"%":""}</div>`).join("")}</div>
      <div class="legend rise">${Y.mix.map(([n,p],i)=>`<span style="--c:var(${MIXC[i]})">${esc(n.charAt(0).toUpperCase()+n.slice(1))} ${p}%</span>`).join("")}</div>`:""}`});
  if(Y.kind) list.push({c:"c-butter",dur:5600,h:`
    <div class="kicker rise">${t.typeK}</div>
    <div class="badge rise"><div><small>${t.typeS}</small><b>${esc(t.types[Y.kind])}</b></div></div><div class="grow"></div>
    <div class="traits rise"><div><span>${t.tr1}</span><b class="num">${String(Y.peakHour).padStart(2,"0")}:00</b></div>
      <div><span>${t.tr2}</span><b class="num">%${Y.night}</b></div><div><span>${t.tr3}</span><b class="num">%${Y.weekend}</b></div></div>`});
  list.push({c:"c-night final",dur:0,h:`
    <div class="kicker rise">${t.finK(Y.year)}</div>
    <div class="receipt rise"><div class="t">${t.finT}</div><div class="c">${t.finC} · ${Y.year}</div><div class="rule"></div>
      ${Y.prompts?`<div class="row"><span>${t.fP}</span><span class="num">${fmt(Y.prompts)}</span></div>`:""}
      ${Y.commits?`<div class="row"><span>${t.fC}</span><span class="num">${fmt(Y.commits)}</span></div>`:""}
      <div class="row"><span>${t.fPr}</span><span class="num">${P.length}</span></div>
      ${Y.activeDays?`<div class="row"><span>${t.fD}</span><span class="num">${Y.activeDays}</span></div>`:""}
      ${Y.streak>1?`<div class="row"><span>${t.fS}</span><span class="num">${Y.streak} ${t.daysW}</span></div>`:""}
      <div class="row"><span>${t.fTop}</span><span>${esc(top[0])}</span></div>
      ${Y.value?`<div class="row"><span>${t.fV}</span><span class="num">${value}</span></div>`:""}
      <div class="rule"></div><div class="grand"><span>${t.fTotal}</span><span class="num">${hm(Y.total)}</span></div><div class="bc"></div></div>
    <div class="actions rise"><button class="primary" id="copy" type="button">${t.copy}</button><button class="ghost" id="replay" type="button">${t.replay}</button></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <p class="caption rise" id="cap">${esc(t.caption(Y.year,hm(Y.total),P.length,value))}</p>
    <p class="sig"><i></i><b>slipt-phi.vercel.app</b><br>${t.sig}</p>`});
  return list;
}

const phone=document.getElementById("phone"), host=document.getElementById("cards"), barsEl=document.getElementById("bars");
const still=matchMedia("(prefers-reduced-motion: reduce)");
let C=[], idx=0, started=0, elapsed=0, paused=false, raf=0;
if(POSTER) document.documentElement.classList.add("poster");
function render(keep=0){
  C=cards();
  host.innerHTML=C.map((c,i)=>`<section class="card ${c.c}" aria-hidden="true">${c.h}</section>`).join("");
  barsEl.innerHTML=C.map(()=>`<div class="bar"><i></i></div>`).join("");
  document.querySelectorAll("[data-t]").forEach(el=>{const v=L()[el.dataset.t]; if(typeof v==="string") el.textContent=v;});
  document.getElementById("lang").textContent=L().other; document.getElementById("wtag").textContent=`WRAPPED ${Y.year}`;
  document.documentElement.lang=lang; document.title=`Vibe Wrapped ${Y.year}`; phone.setAttribute("aria-label",document.title);
  document.getElementById("prev").setAttribute("aria-label",lang==="tr"?"Önceki kart":"Previous card");
  document.getElementById("next").setAttribute("aria-label",lang==="tr"?"Sonraki kart":"Next card");
  wireFinal(); show(POSTER?C.length-1:keep,!POSTER);
}
function wireFinal(){
  const copy=document.getElementById("copy"), toast=document.getElementById("toast"), cap=document.getElementById("cap");
  copy.addEventListener("click",async e=>{
    e.stopPropagation();
    try{await navigator.clipboard.writeText(cap.textContent); toast.textContent=L().copied;}
    catch(err){const r=document.createRange(); r.selectNodeContents(cap); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast.textContent=L().copyFail;}
  });
  document.getElementById("replay").addEventListener("click",e=>{e.stopPropagation(); show(0);});
}
function show(i,animate=true){
  idx=Math.max(0,Math.min(C.length-1,i)); elapsed=0; started=performance.now();
  host.querySelectorAll(".card").forEach((el,j)=>{
    el.classList.toggle("on",j===idx); el.classList.remove("in"); el.setAttribute("aria-hidden",j===idx?"false":"true");
    el.querySelectorAll("button").forEach(b=>b.tabIndex=j===idx?0:-1);
  });
  phone.dataset.ink=/c-(coral|butter|paper|lav)/.test(C[idx].c)?"dark":"light";
  const card=host.children[idx];
  if(animate&&!still.matches){void card.offsetWidth; card.classList.add("in"); countUp(card);}
  barsEl.querySelectorAll(".bar i").forEach((b,j)=>b.style.width=j<idx?"100%":"0%");
  if(!POSTER) tick();
}
function countUp(card){
  const el=card.querySelector("[data-min]"); if(!el) return;
  const to=+el.dataset.min, t0=performance.now(), dur=1400;
  const step=now=>{const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3); el.textContent=hm(Math.round(to*e)); if(k<1) requestAnimationFrame(step);};
  requestAnimationFrame(step);
}
function tick(){
  cancelAnimationFrame(raf);
  const loop=now=>{
    const dur=C[idx].dur;
    if(!paused&&dur) elapsed=now-started;
    barsEl.children[idx].firstElementChild.style.width=dur?Math.min(100,elapsed/dur*100)+"%":"100%";
    if(dur&&!paused&&elapsed>=dur){show(idx+1); return;}
    raf=requestAnimationFrame(loop);
  };
  raf=requestAnimationFrame(loop);
}
function pause(on){if(on===paused) return; paused=on; if(!on) started=performance.now()-elapsed;}
let holdTimer=0, held=false;
document.getElementById("next").addEventListener("click",()=>{if(!held&&idx<C.length-1) show(idx+1);});
document.getElementById("prev").addEventListener("click",()=>{if(!held) show(idx-1);});
phone.addEventListener("pointerdown",()=>{held=false; holdTimer=setTimeout(()=>{held=true; pause(true);},220);});
addEventListener("pointerup",()=>{clearTimeout(holdTimer); if(held){pause(false); setTimeout(()=>held=false,0);}});
addEventListener("pointercancel",()=>{clearTimeout(holdTimer); held=false; pause(false);});
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "){e.preventDefault(); if(idx<C.length-1) show(idx+1);}
  else if(e.key==="ArrowLeft"){e.preventDefault(); show(idx-1);}
});
document.addEventListener("visibilitychange",()=>pause(document.hidden));
document.getElementById("lang").addEventListener("click",()=>{lang=lang==="tr"?"en":"tr"; try{localStorage.setItem("vw-lang",lang);}catch(e){} render(idx);});
render(0);
</script>
</body></html>
